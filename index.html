<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风铃中医 AI 客服</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; margin:0; background:#f7f5ef; }
#chat-container { max-width:600px; margin:20px auto; background:#fff; border-radius:12px; padding:16px; box-shadow:0 4px 10px rgba(0,0,0,0.08);}
#messages { min-height:400px; overflow-y:auto; padding:8px; border:1px solid #e5e7eb; border-radius:12px; margin-bottom:8px; }
.message { margin:6px 0; padding:8px 12px; border-radius:12px; max-width:80%; }
.user { background:#2f6f5e; color:#fff; margin-left:auto; text-align:right;}
.ai { background:#e5e7eb; color:#1f2933; margin-right:auto; text-align:left;}
#user-input { width:calc(100% - 80px); padding:10px; border-radius:8px; border:1px solid #ccc; }
#send-btn { width:60px; padding:10px; border:none; border-radius:8px; background:#2f6f5e; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div id="chat-container">
  <div id="messages"></div>
  <div style="display:flex;">
    <input id="user-input" placeholder="请输入问题..." />
    <button id="send-btn">发送</button>
  </div>
</div>
<script>
const messagesDiv = document.getElementById("messages");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");

// 保存对话上下文
let conversation = [
  { role:"system", content:"你是风铃中医在线客服，回答问题专业但温和。不要替代医生诊断。"}
];

function appendMessage(text, cls){
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.textContent = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage(){
  const text = userInput.value.trim();
  if(!text) return;
  appendMessage(text, "user");
  conversation.push({role:"user", content:text});
  userInput.value="";
  appendMessage("AI 正在回答...", "ai");

  try{
    const res = await fetch("/.netlify/functions/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ conversation })
    });
    const data = await res.json();
    // 替换最后一条提示消息
    const aiDivs = messagesDiv.getElementsByClassName("ai");
    aiDivs[aiDivs.length-1].textContent = data.reply;
    conversation.push({role:"assistant", content:data.reply});
  }catch(e){
    const aiDivs = messagesDiv.getElementsByClassName("ai");
    aiDivs[aiDivs.length-1].textContent = "AI 回答失败，请稍后重试。";
  }
}

sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keypress", (e)=>{ if(e.key==="Enter") sendMessage(); });
</script>
</body>
</html>
