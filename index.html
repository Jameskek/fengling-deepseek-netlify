<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fengling TCM AI 初筛助手</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2f6f5e;
      --accent-dark: #24584a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 18px 60px;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47,111,94,0.12);
    }
    button {
      margin-top: 16px;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 16px;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }
    .notice {
      font-size: 13px;
      color: var(--muted);
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
    }
    .result {
      white-space: pre-wrap;
      min-height: 460px;
      font-size: 15px;
    }
    .small {
      font-size: 13px;
      color: var(--muted);
    }
    .footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Fengling TCM AI 初筛助手</h1>
      <p class="sub">用于整理患者主诉、生成问诊摘要与就诊建议。AI 输出仅供健康教育与就诊前整理，不等同诊断。</p>
    </header>

    <div class="grid">
      <section class="card">
        <label>姓名 / Name</label>
        <input id="name" placeholder="可选" />

        <label>年龄 / Age</label>
        <input id="age" placeholder="例如：35" />

        <label>性别 / Gender</label>
        <select id="gender">
          <option value="">请选择</option>
          <option>男 / Male</option>
          <option>女 / Female</option>
          <option>其他 / Other</option>
        </select>

        <label>主要不舒服 / Main complaint</label>
        <textarea id="complaint" placeholder="例如：胃胀、胃痛、睡眠差、月经不调、颈肩痛等"></textarea>

        <label>持续多久 / Duration</label>
        <input id="duration" placeholder="例如：2周、3个月、反复多年" />

        <label>伴随症状 / Associated symptoms</label>
        <textarea id="symptoms" placeholder="食欲、大便、小便、睡眠、情绪、疼痛性质、怕冷怕热等"></textarea>

        <label>既往病史 / Medical history</label>
        <textarea id="history" placeholder="疾病、手术、过敏、长期服药、怀孕等"></textarea>

        <label>舌象描述 / Tongue description</label>
        <textarea id="tongue" placeholder="例如：舌淡、舌红、苔白、苔黄腻、齿痕、裂纹等。也可以留空。"></textarea>

        <button id="submitBtn">生成 AI 初筛摘要</button>

        <div class="notice">
          免责声明：本工具不提供确诊，不替代医生面诊。若出现胸痛、呼吸困难、黑便、呕血、剧烈腹痛、突然肢体无力、意识异常、高热不退等情况，应立即就医。
        </div>
      </section>

      <section class="card">
        <h2 style="margin-top:0;font-size:20px;">AI 输出</h2>
        <div id="result" class="result small">填写左侧内容后点击生成。</div>
      </section>
    </div>

    <div class="footer">
      Fengling TCM · Online TCM consultation support
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    $("submitBtn").addEventListener("click", async () => {
      const payload = {
        name: $("name").value.trim(),
        age: $("age").value.trim(),
        gender: $("gender").value,
        complaint: $("complaint").value.trim(),
        duration: $("duration").value.trim(),
        symptoms: $("symptoms").value.trim(),
        history: $("history").value.trim(),
        tongue: $("tongue").value.trim()
      };

      if (!payload.complaint) {
        $("result").textContent = "请至少填写主要不舒服。";
        return;
      }

      $("submitBtn").disabled = true;
      $("submitBtn").textContent = "生成中...";
      $("result").textContent = "AI 正在整理资料...";

      try {
        const res = await fetch("/.netlify/functions/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "请求失败");
        }

        $("result").textContent = data.answer || "没有返回内容。";
      } catch (err) {
        $("result").textContent = "错误：" + err.message;
      } finally {
        $("submitBtn").disabled = false;
        $("submitBtn").textContent = "生成 AI 初筛摘要";
      }
    });
  </script>
</body>
</html>
