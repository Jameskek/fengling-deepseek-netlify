<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
(function(){
  try{
    var savedTheme = localStorage.getItem('xfl-theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if(savedTheme === 'dark'){
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
  }catch(e){}
})();
</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>夏风凌 | AI 客服终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" crossorigin="anonymous"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        clinic: { accent: '#10b981', dark: '#047857' }
                    }
                }
            }
        }
    </script>
    <style>
        /* 核心重置与滚动条优化 */
        body { 
            background-color: #f6f7f9; 
            color: #18181b; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease;
        }
        .dark body { background-color: #050505; color: #f5f5f7; }

        ::-webkit-scrollbar { width: 5px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #333333; }

        /* 顶部导航毛玻璃 */
        .glass-nav { 
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); transition: all 0.4s ease; 
        }
        .dark .glass-nav { background: rgba(0, 0, 0, 0.85); border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* 聊天容器毛玻璃 */
        .glass-chat {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.04);
        }
        .dark .glass-chat {
            background: rgba(15, 15, 15, 0.85); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* 打字机动画 */
        .typing-indicator span {
            display: inline-block; width: 6px; height: 6px; background-color: #a1a1aa; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .deepseek-glow { text-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 文本换行处理 */
        .msg-content { white-space: pre-wrap; word-wrap: break-word; }

        /* 主题切换按钮 */
        .btn-icon {
            padding: 8px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.1); background: rgba(0,0,0,0.03); color: #18181b; cursor: pointer; transition: all 0.2s;
        }
        .dark .btn-icon { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #f5f5f7; }
        .btn-icon:hover { background: rgba(0,0,0,0.08); }
        .dark .btn-icon:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <nav class="w-full glass-nav px-4 md:px-6 py-3 flex justify-between items-center z-50 flex-shrink-0">
        <div class="flex items-center">
            <i data-lucide="hexagon" class="w-5 h-5 mr-2 text-emerald-500"></i>
            <div class="flex flex-col">
                <span class="text-xs md:text-sm tracking-[0.2em] font-bold uppercase text-zinc-900 dark:text-white">XIA FENGLING</span>
                <span class="text-[9px] text-zinc-500 uppercase tracking-widest font-mono">AI Support Terminal</span>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 border-r border-zinc-300 dark:border-zinc-700 pr-4">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></div>
                <span class="text-[10px] text-emerald-600 dark:text-emerald-400 uppercase tracking-widest font-mono font-bold hidden sm:inline-block">DeepSeek Active</span>
            </div>
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme">
                <i data-lucide="moon" id="theme-toggle-dark-icon" class="w-4 h-4 hidden"></i>
                <i data-lucide="sun" id="theme-toggle-light-icon" class="w-4 h-4 hidden"></i>
            </button>
        </div>
    </nav>

    <main class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-6 flex flex-col min-h-0">
        
        <div class="glass-chat flex-1 flex flex-col rounded-[24px] overflow-hidden relative">
            
            <div class="px-6 py-4 border-b border-zinc-100 dark:border-zinc-800/50 bg-white/50 dark:bg-black/20 flex items-center justify-between shrink-0">
                <div class="flex items-center">
                    <div class="w-10 h-10 rounded-full bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800 flex items-center justify-center mr-3">
                        <i data-lucide="bot" class="w-5 h-5 text-emerald-600 dark:text-emerald-400"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-zinc-900 dark:text-white">风铃中医专属 AI 客服</h2>
                        <p class="text-[11px] text-zinc-500 font-mono">Trained on Medical Algorithms</p>
                    </div>
                </div>
            </div>

            <div id="messages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth">
                <div class="flex justify-start w-full">
                    <div class="max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3.5 text-[14px] md:text-[15px] leading-relaxed shadow-sm bg-white dark:bg-[#1a1a1c] text-zinc-800 dark:text-zinc-200 border border-zinc-100 dark:border-zinc-800/80 rounded-tl-sm">
                        <p class="msg-content">您好！我是风铃中医的智能助理。您可以向我咨询关于看诊预约、中医体质、生活调理或系统收费等问题。</p>
                    </div>
                </div>
            </div>

            <div id="typing-box" class="px-6 pb-2 hidden shrink-0">
                <div class="flex justify-start w-full">
                    <div class="rounded-2xl px-5 py-3 shadow-sm bg-white dark:bg-[#1a1a1c] border border-zinc-100 dark:border-zinc-800/80 rounded-tl-sm flex items-center">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-500 mr-2 animate-pulse"></i>
                        <div class="typing-indicator flex items-center pt-1">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-4 md:p-5 bg-white/80 dark:bg-[#0a0a0a]/80 border-t border-zinc-100 dark:border-zinc-800/50 backdrop-blur-md shrink-0">
                <div class="flex items-end gap-3 max-w-4xl mx-auto">
                    <div class="flex-1 bg-zinc-50 dark:bg-[#111111] border border-zinc-200 dark:border-zinc-800 rounded-2xl focus-within:border-emerald-500 dark:focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20 transition-all overflow-hidden flex items-center px-2">
                        <textarea id="user-input" rows="1" class="w-full bg-transparent border-none focus:ring-0 resize-none py-3.5 px-3 text-sm md:text-[15px] text-zinc-900 dark:text-white placeholder:text-zinc-400 dark:placeholder:text-zinc-600 outline-none" placeholder="输入您的问题 (按 Enter 發送)..." style="max-height: 120px;"></textarea>
                    </div>
                    <button id="send-btn" class="shrink-0 h-[50px] w-[50px] rounded-2xl bg-zinc-900 hover:bg-emerald-600 dark:bg-white dark:text-black dark:hover:bg-emerald-500 text-white flex items-center justify-center transition-all shadow-md active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="send" class="w-5 h-5 ml-0.5"></i>
                    </button>
                </div>
                <div class="text-center mt-3">
                    <p class="text-[10px] text-zinc-400 font-mono tracking-widest">AI GENERATED CONTENT MAY BE INACCURATE. NOT FOR MEDICAL DIAGNOSIS.</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        // 🌟 昼夜切换逻辑
        const themeBtn = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        const updateThemeIcons = () => {
            if (html.classList.contains('dark')) {
                document.getElementById('theme-toggle-dark-icon').classList.add('hidden');
                document.getElementById('theme-toggle-light-icon').classList.remove('hidden');
            } else {
                document.getElementById('theme-toggle-dark-icon').classList.remove('hidden');
                document.getElementById('theme-toggle-light-icon').classList.add('hidden');
            }
        };
        updateThemeIcons();

        themeBtn.addEventListener('click', () => {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('xfl-theme', 'light');
            } else {
                html.classList.add('dark');
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('xfl-theme', 'dark');
            }
            updateThemeIcons();
        });

        // 🌟 核心聊天逻辑
        const messagesDiv = document.getElementById("messages");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const typingBox = document.getElementById("typing-box");

        // 自动调整 textarea 高度
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 120 ? this.scrollHeight : 120) + 'px';
        });

        // 保存对话上下文，静默注入合规大马标准
        let conversation = [
            { 
                role: "system", 
                content: "你是风铃中医在线客服，回答问题专业但温和。请注意：在马来西亚，中医师不替代西医诊断，而是作为辅助健康资源。你绝不能替代医生进行确诊或开药，遇到严重疾病必须建议患者前往现代医学急诊。"
            }
        ];

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 渲染气泡 UI
        function appendMessage(text, isUser) {
            const wrapper = document.createElement("div");
            wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement("div");
            
            if (isUser) {
                // 用户气泡样式
                bubble.className = "max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3.5 text-[14px] md:text-[15px] leading-relaxed shadow-md bg-emerald-600 dark:bg-emerald-700 text-white rounded-tr-sm";
            } else {
                // AI 气泡样式
                bubble.className = "max-w-[85%] md:max-w-[75%] rounded-2xl px-5 py-3.5 text-[14px] md:text-[15px] leading-relaxed shadow-sm bg-white dark:bg-[#1a1a1c] text-zinc-800 dark:text-zinc-200 border border-zinc-100 dark:border-zinc-800/80 rounded-tl-sm msg-content ai-message";
            }

            bubble.textContent = text;
            wrapper.appendChild(bubble);
            messagesDiv.appendChild(wrapper);
            scrollToBottom();
            return bubble;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            
            // 锁定界面
            userInput.value = "";
            userInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            // 渲染用户输入
            appendMessage(text, true);
            conversation.push({ role: "user", content: text });
            
            // 显示 Typing
            typingBox.classList.remove("hidden");
            scrollToBottom();

            try {
                // ⚠️ 这里保留了您原本的 Netlify serverless function 地址
                const res = await fetch("/.netlify/functions/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ conversation })
                });
                
                const data = await res.json();
                
                // 隐藏 Typing
                typingBox.classList.add("hidden");
                
                // 渲染 AI 结果
                if(data.reply) {
                    appendMessage(data.reply, false);
                    conversation.push({ role: "assistant", content: data.reply });
                } else {
                    throw new Error("No reply found");
                }
                
            } catch(e) {
                console.error("Chat error:", e);
                typingBox.classList.add("hidden");
                appendMessage("⚠️ 系统算力终端连接超时，请稍后重试。", false);
            } finally {
                // 解锁界面
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        
        // 支持 Enter 发送 (Shift+Enter 换行)
        userInput.addEventListener("keypress", (e) => { 
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage(); 
            }
        });
    </script>
</body>
</html>
